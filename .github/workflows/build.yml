name: Tests and installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Unit tests (incl. ImageJ / MATLAB reference values and a headless GUI run)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  installers:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: ubuntu-22.04
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install . "pyinstaller>=6.3"

      - name: Linux build (tar.gz, .deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libfuse2
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" bash packaging/build_linux.sh

      - name: macOS build (.app, .dmg)
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh

      - name: Windows build (Inno Setup installer, portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./packaging/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MicrosCount-${{ matrix.label }}
          path: |
            dist/release/*
            dist/selftest-*.txt
          if-no-files-found: error

  release:
    # Publishes a GitHub release when main carries a version that has not been released yet
    # (bump src/microscount/_version.py and push), or when a v* tag is pushed.
    needs: installers
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version to release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/microscount/_version.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$VERSION is already released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "releasing v$VERSION"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MicrosCount ${{ steps.v.outputs.version }}
          make_latest: "true"
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.tar.gz
          body: |
            ## Download
            | System | File |
            |---|---|
            | Windows 10/11 | `MicrosCount-*-Windows-x64-Setup.exe` (or the portable `.zip`) |
            | macOS Apple silicon | `MicrosCount-*-macOS-arm64.dmg` |
            | macOS Intel | `MicrosCount-*-macOS-x86_64.dmg` |
            | Ubuntu / Debian | `microscount_*_amd64.deb` |
            | Other Linux | `MicrosCount-*-x86_64.AppImage` or the `.tar.gz` |

            First launch: on Windows choose **More info → Run anyway**; on macOS right-click the app → **Open**
            (the builds are not code-signed). See the [README](https://github.com/mertol93/MicrosCount#readme).

            **Please cite** Acarer-Arat et al. (2024) *ACS Omega* 9(41):42159–42171,
            https://doi.org/10.1021/acsomega.4c03038 when you publish results obtained with MicrosCount.
